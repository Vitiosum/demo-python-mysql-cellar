[project]
name = "herbarium"
version = "1.0.0"
description = "The Herbarium: a living collection of pressed specimens. Python + MySQL + Cellar on Clever Cloud."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pymysql[rsa]>=1.2.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
